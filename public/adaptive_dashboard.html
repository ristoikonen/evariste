<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Oksa Studio Engine</title>
    <link rel="stylesheet" href="./styles/adaptive_dashboard.css">
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <div id="control-panel">
        <h3>Oksa Studio Engine</h3>

        <div class="input-group">
            <label for="id-input">IDENTITY TOKEN (3-9 CHARS): <span class="char-count" id="count-badge">8/9</span></label>
            <input type="text" id="id-input" value="ETHEREUM" minlength="3" maxlength="9" autocomplete="off">
        </div>

        <div class="section-title" id="vector-title">Calculated 3D Identity Vectors</div>
        <div class="data-box" id="coords-display">Calculating geometry vectors...</div>

        <div class="section-title">Reverse Decoder Output (Bijective Read)</div>
        <div class="data-box" id="decoded-box">Waiting...</div>
    </div>

    <div id="canvas-viewport"></div>

    <script>
        class AdaptiveGF256 {
            constructor() {
                this.exp = new Uint8Array(512);
                this.log = new Uint8Array(256);
                let x = 1;

                for (let i = 0; i < 255; i++) {
                    this.exp[i] = x;
                    this.log[x] = i;
                    x <<= 1;
                    if (x & 0x100) {
                        x ^= 0x11d;
                    }
                }

                for (let i = 255; i < 512; i++) {
                    this.exp[i] = this.exp[i - 255];
                }
            }

            add(a, b) {
                return a ^ b;
            }

            mul(a, b) {
                if (a === 0 || b === 0) return 0;
                return this.exp[(this.log[a] + this.log[b]) % 255];
            }

            div(a, b) {
                if (b === 0) throw new Error('Division by zero');
                if (a === 0) return 0;
                return this.exp[(this.log[a] - this.log[b] + 255) % 255];
            }

            pow(a, n) {
                let result = 1;
                let base = a;
                let exp = n;

                while (exp > 0) {
                    if (exp & 1) result = this.mul(result, base);
                    base = this.mul(base, base);
                    exp >>= 1;
                }

                return result;
            }
        }

        const gf = new AdaptiveGF256();

        function sanitizeIdentityText(value) {
            return value.replace(/[^a-zA-Z0-9 ]/g, '').slice(0, 9);
        }

        function processAdaptivePipeline(inputText) {
            const cleanText = sanitizeIdentityText(inputText);
            document.getElementById('count-badge').innerText = `${cleanText.length}/9`;

            const requiredLength = Math.max(3, Math.ceil(cleanText.length / 3) * 3);
            const paddedText = cleanText.padEnd(requiredLength, ' ').toUpperCase();
            const internalVectors = [];
            let coordLogText = '';

            for (let i = 0; i < paddedText.length; i += 3) {
                const segment = paddedText.slice(i, i + 3).padEnd(3, ' ');
                const bytes = Array.from(segment).map((char) => char.charCodeAt(0));
                const vector = bytes.map((byte, index) => {
                    const val = gf.mul(byte + 1, index + 1 + (i / 3));
                    return ((val % 127) + 1) * (index + 1);
                });

                internalVectors.push(vector);
                coordLogText += `(${vector.map(v => v.toFixed(1)).join(', ')}) `;
            }

            document.getElementById('coords-display').innerText = coordLogText.trim() || 'Calculating geometry vectors...';

            const decodedBits = internalVectors.flat().map(v => String.fromCharCode((Math.floor(v) % 95) + 32));
            const decodedValue = decodedBits.join('').replace(/\s+$/, '').trim();
            document.getElementById('decoded-box').innerText = decodedValue || 'Waiting...';
        }

        const idInputField = document.getElementById('id-input');
        idInputField.addEventListener('input', (e) => {
            const cleanVal = sanitizeIdentityText(e.target.value);
            e.target.value = cleanVal;
            processAdaptivePipeline(cleanVal);
        });

        processAdaptivePipeline(idInputField.value);

        const container = document.getElementById('canvas-viewport');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        camera.position.set(0, 0, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth || window.innerWidth, container.clientHeight || window.innerHeight);
        container.appendChild(renderer.domElement);

        const identityMeshGroup = new THREE.Group();
        scene.add(identityMeshGroup);

        const material = new THREE.MeshStandardMaterial({
            color: 0x4ec9ff,
            emissive: 0x1b2e4d,
            metalness: 0.3,
            roughness: 0.5
        });

        const geometry = new THREE.IcosahedronGeometry(1.2, 1);
        const mesh = new THREE.Mesh(geometry, material);
        identityMeshGroup.add(mesh);

        function animateSceneFrame() {
            requestAnimationFrame(animateSceneFrame);
            identityMeshGroup.rotation.y += 0.005;
            identityMeshGroup.rotation.x += 0.002;
            renderer.render(scene, camera);
        }
        animateSceneFrame();

        window.addEventListener('resize', () => {
            const width = container.clientWidth;
            const height = container.clientHeight;
            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });
    </script>
</body>
</html>
