<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stego Graph • Glow2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cadence-blue: #2563eb;
            --cadence-dark: #0f172a;
            --crayon-orange: #f78522;
            --crayon-amber: #BF8040;
            --crayon-blue: #406ABF;
            --crayon-red: #BF4040;
            --crayon-purple: #950495;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            --emerald-500: #10b981;
        }
        * {box-sizing:border-box;margin:0;padding:0;}
        body {font-family:'Inter',sans-serif;background-color:var(--slate-50);color:var(--slate-900);min-height:100vh;display:flex;flex-direction:column;}
        .container {max-width:72rem;margin:auto;padding:1.5rem;width:100%;flex:1;display:grid;grid-template-columns:repeat(12,1fr);gap:2rem;}
        .card {background-color:white;border:1px solid var(--slate-200);border-radius:1rem;padding:2rem;box-shadow:0 4px 20px -2px rgba(15,23,42,0.05),0 2px 6px -1px rgba(15,23,42,0.03);}
        .btn {font-weight:600;padding:0.75rem 1.5rem;border-radius:0.75rem;font-size:0.875rem;cursor:pointer;transition:all 0.2s ease;display:inline-flex;align-items:center;justify-content:center;}
        .btn-primary {background-color:var(--cadence-blue);color:white;flex:1;}
        .btn-primary:hover {background-color:#1d4ed8;}
        .btn-secondary {background-color:var(--slate-100);border:1px solid var(--slate-200);color:var(--slate-700);}
        .btn-secondary:hover {background-color:var(--slate-200);}
        input[type="text"], textarea {width:100%;border:1px solid var(--slate-200);border-radius:0.75rem;padding:0.75rem 1rem;font-size:0.875rem;background-color:var(--slate-50);color:var(--slate-800);transition:all 0.2s ease;}
        input[type="text"]:focus, textarea:focus {outline:none;border-color:var(--cadence-blue);background-color:white;box-shadow:0 0 0 3px rgba(37,99,235,0.1);}
        label {display:block;font-size:0.75rem;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--slate-600);margin-bottom:0.5rem;}
        canvas {border:1px solid var(--slate-200);background-color:white;}
    </style>
</head>
<body>
    <header class="card-shadow" style="margin-bottom:2rem;">
        <div class="container">
            <h1 class="text-slate-900" style="font-size:1.5rem;font-weight:700;">Stego Graph Encoder / Decoder</h1>
        </div>
    </header>
    <main class="container">
        <div class="col-span-7">
            <div class="card">
                <h2 class="text-slate-900" style="font-size:1.25rem;font-weight:700;">Input (max 8 ASCII chars)</h2>
                <label for="inputField">Text Payload</label>
                <input type="text" id="inputField" placeholder="Enter up to 8 characters" maxlength="8">
                <button class="btn btn-primary" style="margin-top:1rem;" onclick="encodeData()">Encode → Graph</button>
            </div>
        </div>
        <div class="col-span-5">
            <div class="card">
                <h2 class="text-slate-900" style="font-size:1.25rem;font-weight:700;">2‑D Steganographic Graph</h2>
                <canvas id="graphCanvas" width="400" height="120"></canvas>
                <button class="btn btn-secondary" style="margin-top:1rem;" onclick="decodeData()">← Decode Graph</button>
                <label for="outputField" style="margin-top:1rem;">Decoded Output</label>
                <input type="text" id="outputField" readonly placeholder="Decoded text will appear here">
            </div>
        </div>
    </main>
    <footer class="card-shadow" style="margin-top:2rem;">
        <div class="container" style="text-align:center;font-size:0.75rem;color:var(--slate-500);">
            Glow2 • Stego Graph Demo – Palette: #f78522, #BF8040, #406ABF, #BF4040, #950495
        </div>
    </footer>
    <script>
        const canvas = document.getElementById('graphCanvas');
        const ctx = canvas.getContext('2d');
        const BLOCK_W = 40;
        const BLOCK_H = 80;
        const START_X = 20;
        const START_Y = 20;
        function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);}
        function encodeData(){const input=document.getElementById('inputField').value;if(!input){alert('Enter text');return;}if(input.length>8){alert('Max 8 chars');return;}clearCanvas();for(let i=0;i<input.length;i++){const byte=input.charCodeAt(i);ctx.fillStyle=`rgb(${byte},${byte},${byte})`;const x=START_X+i*(BLOCK_W+5);ctx.fillRect(x,START_Y,BLOCK_W,BLOCK_H);} }
        function decodeData(){const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;let out='';for(let i=0;i<8;i++){const x=START_X+i*(BLOCK_W+5)+Math.floor(BLOCK_W/2);const y=START_Y+Math.floor(BLOCK_H/2);const idx=(y*canvas.width+x)*4;const r=data[idx];if(r===255)break;out+=String.fromCharCode(r);}document.getElementById('outputField').value=out;}
        window.onload=clearCanvas;
    </script>
</body>
</html>
